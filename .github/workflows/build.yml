name: בניית APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # עדכונים: מעלים לריפו את קובץ ה-ZIP כמו שהוא (בלי לחלץ), והבנייה מחלצת אותו כאן לבד
      - name: Apply update ZIPs
        run: |
          ls -1 *.zip 2>/dev/null | sort -V | while IFS= read -r z; do
            echo "מחלץ $z"
            unzip -o -q "$z" -d .
          done
          rm -f "capacitor.config (1).json" MainActivity.java

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Signing key
        env:
          HAMAL_KEY: ${{ secrets.HAMAL_KEY }}
        run: |
          if [ -z "$HAMAL_KEY" ]; then echo "::error::Missing secret HAMAL_KEY. See the guide, step 4."; exit 1; fi
          PASS="${HAMAL_KEY%%:*}"
          echo "${HAMAL_KEY#*:}" | base64 -d > android/app/hamal-release.jks
          printf 'storeFile=hamal-release.jks\nstorePassword=%s\nkeyAlias=hamal\nkeyPassword=%s\n' "$PASS" "$PASS" > android/app/keystore.properties

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/hamal-aviad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hamal-aviad-apk-${{ github.run_number }}
          path: out/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "חמ\"ל אביעד · גרסה 1.${{ github.run_number }}"
          make_latest: true
          files: out/hamal-aviad.apk
